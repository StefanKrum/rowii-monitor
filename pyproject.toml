[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rowii-monitor"
version = "0.1.0"
description = "Acoustic + vibration condition monitoring for the Rodundwerk II pump-turbine (HSG master thesis implementation)"
authors = [{name = "Stefan Krummenacher"}]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26", "scipy>=1.12", "scikit-learn>=1.4", "hmmlearn>=0.3.2",
  "pandas>=2.2", "matplotlib>=3.8", "openpyxl>=3.1", "python-dotenv>=1.0",
  "pyarrow>=15",
]

[project.urls]
Homepage = "https://stefankrum.github.io/rowii-monitor/"
Repository = "https://github.com/StefanKrum/rowii-monitor"

[project.optional-dependencies]
beats = ["torch>=2.2", "torchaudio>=2.2"]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.10"]

[tool.setuptools]
package-dir = {"" = "src"}
[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["src/rowii/vendor"]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["src/rowii/vendor"]

[[tool.mypy.overrides]]
module = "rowii.vendor.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: needs ROWII_DATA_ROOT with real recordings"]
